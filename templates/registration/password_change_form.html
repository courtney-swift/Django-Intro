{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
  Password Change
{% endblock %}


{% block content %}
  <h1>Password Change</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Change Password" class="btn btn-success">
  </form>
{% endblock %}
