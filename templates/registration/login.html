{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block title %}

{% endblock %}

{% block content %}
  <h1>Log In</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Log In" class="btn btn-success">
  </form>
  <a href="{% url 'password_reset' %}" class="btn btn-secondary">Forgot Password?</a>
{% endblock %}
