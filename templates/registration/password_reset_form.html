{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
  Reset Password
{% endblock %}

{% block content %}
  <h2>Forgot Your Password?</h2>
  <p>Enter your mail address below, and we'll send you a link to reset your password.</p>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Send Reset Link" class="btn btn-primary">
  </form>
  <p class="mt-3">
    <a href="{% url 'login' %}">Back to login</a>
  </p>
{% endblock %}
